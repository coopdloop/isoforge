[project]
name = "isoforge-py"
version = "0.1.0"
description = "IsoForge agent orchestrator + deterministic render engine"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "jsonschema>=4.23",
  "jsonpatch>=1.33",
  "httpx>=0.27",
  "pillow>=11.0",
]

[project.optional-dependencies]
raster = ["resvg-py>=0.1.7"]
llm = ["anthropic>=0.39", "openai>=1.54"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["isoforge_py"]

# The IsoDSL schema is shared with the Go validator and lives at the repo root, so it
# is copied into the package at build time (see hatch_build.py).
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
