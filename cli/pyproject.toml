[project]
name = "isoforge"
version = "0.1.0"
description = "Design isometric cube-art logos by chatting with an LLM"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "typer>=0.15",
  "rich>=13.9",
  "httpx>=0.27",
  "pillow>=11.0",
  "isoforge-py[raster]",
]

[project.scripts]
isoforge = "isoforge.main:run"

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["isoforge"]
artifacts = ["isoforge/bin/isoforged"]

# The Go daemon is compiled separately and bundled in (see hatch_build.py).
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.uv.sources]
isoforge-py = { path = "../services" }

[tool.ruff]
line-length = 100
target-version = "py311"
