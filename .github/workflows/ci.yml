name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Lint
        run: |
          uv run --extra dev ruff check isoforge tests
          uv run --extra dev ruff format --check isoforge tests

      - name: Test
        run: uv run --extra dev pytest -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      - name: Build wheel
        run: uv build --wheel

      # A wheel that cannot run outside the repo is a broken wheel, so install it
      # into a clean environment and exercise the CLI end to end.
      - name: Smoke test the built wheel
        run: |
          uv venv /tmp/smoke
          VIRTUAL_ENV=/tmp/smoke uv pip install dist/*.whl
          /tmp/smoke/bin/isoforge version
          /tmp/smoke/bin/isoforge doctor
          /tmp/smoke/bin/isoforge list

      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl
